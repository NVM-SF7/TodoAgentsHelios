[project]
name = "todo-agent"
version = "0.1.0"
description = "Agentic todo app with local LLM and MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
todo-server = "todo_agent.mcp_server:main"
todo-agent = "todo_agent.agent:main"
